# Weekly dependency updates for apps/web and the GitHub Actions used in CI. Security fixes open
# PRs as soon as an advisory is published. Every PR runs CI (types, lint, tests, npm audit);
# nothing merges or deploys automatically. Patch/minor updates are grouped into one weekly PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
