<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketitNow — Down for Maintenance</title>
<style>
  :root {
    --navy: #082040;
    --orange: #e89818;
    --green: #008848;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, var(--navy) 0%, #0a2c5c 55%, #063018 100%);
    position: relative;
    overflow: hidden;
    padding: 24px;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
  }
  .blob-1 {
    top: -120px; left: -120px; width: 380px; height: 380px;
    background: rgba(232, 152, 24, 0.25);
  }
  .blob-2 {
    bottom: -120px; right: -120px; width: 380px; height: 380px;
    background: rgba(0, 136, 72, 0.3);
  }
  .card {
    position: relative;
    z-index: 1;
    max-width: 520px;
    width: 100%;
    text-align: center;
  }
  .logo-badge {
    display: inline-flex;
    background: #ffffff;
    border-radius: 16px;
    padding: 14px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    margin-bottom: 32px;
  }
  .logo-badge img {
    height: 44px;
    width: auto;
    display: block;
  }
  .panel {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
  }
  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(232, 152, 24, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 28px; height: 28px; }
  h1 {
    color: #ffffff;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  p {
    color: rgba(255,255,255,0.65);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 8px;
  }
  .eyebrow {
    color: var(--orange);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .footer-note {
    margin-top: 28px;
    color: rgba(255,255,255,0.35);
    font-size: 13px;
  }
  .dots {
    display: inline-flex;
    gap: 6px;
    margin-top: 22px;
  }
  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--orange);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; background: var(--green); }
  .dots span:nth-child(3) { animation-delay: 0.4s; background: #ffffff; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
