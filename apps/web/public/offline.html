<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e89818">
<title>MarketitNow — Offline</title>
<!-- Served by public/sw.js when a page navigation fails because the device is offline. A static
     file rather than a Next route on purpose: it's precached once at service-worker install and
     must render with no network, no server, and no signed-in session. Styled after maintenance.html. -->
<style>
  :root { --navy: #082040; --orange: #e89818; --green: #008848; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(155deg, var(--navy) 0%, #0a2c5c 55%, #063018 100%);
    color: #ffffff;
  }
  .card { max-width: 440px; width: 100%; text-align: center; }
  .logo-badge {
    display: inline-flex;
    background: #ffffff;
    border-radius: 16px;
    padding: 12px 22px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    margin-bottom: 28px;
  }
  .logo-badge img { height: 40px; width: auto; display: block; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.55; margin: 0 0 28px; color: rgba(255, 255, 255, 0.82); }
  button {
    appearance: none;
    border: 0;
    border-radius: 12px;
    padding: 13px 28px;
    font: inherit;
    font-weight: 600;
    color: #ffffff;
    background: var(--green);
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo-badge"><img src="/logo-sm.png?v=4" alt="MarketitNow"></div>
    <h1 id="title">You're offline</h1>
    <p id="body">Check your internet connection and try again. Your listings, messages and favorites are safe and will be here when you're back.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    (function () {
      // Same five languages as messages/*.json; picks the device language, falls back to English.
      var strings = {
        nl: ["Je bent offline", "Controleer je internetverbinding en probeer het opnieuw. Je advertenties, berichten en favorieten zijn veilig en staan klaar zodra je weer online bent.", "Opnieuw proberen"],
        fr: ["Vous êtes hors ligne", "Vérifiez votre connexion internet et réessayez. Vos annonces, messages et favoris sont en sécurité et seront là à votre retour.", "Réessayer"],
        ar: ["أنت غير متصل بالإنترنت", "تحقق من اتصالك بالإنترنت وحاول مرة أخرى. إعلاناتك ورسائلك ومفضلاتك محفوظة وستكون بانتظارك عند عودتك.", "حاول مرة أخرى"],
        zh: ["您已离线", "请检查网络连接后重试。您的商品、消息和收藏都安全无虞，恢复联网后即可查看。", "重试"]
      };
      var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
      var s = strings[lang];
      if (s) {
        document.documentElement.lang = lang;
        if (lang === "ar") document.documentElement.dir = "rtl";
        document.getElementById("title").textContent = s[0];
        document.getElementById("body").textContent = s[1];
        document.getElementById("retry").textContent = s[2];
      }
      document.getElementById("retry").addEventListener("click", function () { location.reload(); });
      // Come back by itself the moment the connection returns.
      window.addEventListener("online", function () { location.reload(); });
    })();
  </script>
</body>
</html>
